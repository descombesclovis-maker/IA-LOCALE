<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LocalVisionAI</title><link rel="stylesheet" href="/assets/style.css"></head>
<body>
<div class="app">
  <aside class="sidebar closed" id="sidebar">
    <div class="sidebar-head">
      <div class="brand"><div class="brand-mark">✦</div><div><b>LocalVision</b><span>AI</span></div></div>
      <button class="close-sidebar" id="closeSidebar" aria-label="Fermer">×</button>
    </div>

    <button class="new-conversation" id="newConversation"><span>＋</span><b>Nouvelle conversation</b></button>

    <div class="conversation-search"><span>⌕</span><input id="conversationSearch" type="search" placeholder="Rechercher une conversation…"></div>

    <div class="nav-scroll">
      <div class="section-title">CONVERSATIONS</div>
      <div id="conversationsList" class="conversations-list"></div>

      <div class="section-title library-title">MA BIBLIOTHÈQUE</div>
      <button class="library-item" id="photosLibrary"><span>▧</span><span>Mes photos générées</span><em id="photoCount"></em></button>
      <button class="library-item" id="videosLibrary"><span>▣</span><span>Mes vidéos générées</span><em id="videoCount"></em></button>
      <button class="library-item" id="retouchLibrary"><span>✦</span><span>Mes retouches générées</span><em id="retouchCount"></em></button>
    </div>

    <div class="sidebar-bottom">
      <button id="importBtn" class="ghost">＋ Importer un workflow</button>
      <input id="workflowFile" type="file" accept=".json,application/json" hidden>
      <button id="comfyBtn" class="ghost">Ouvrir ComfyUI</button>
      <div class="status"><i></i><span id="statusText">Vérification…</span></div>
    </div>
  </aside>

  <main class="main">
    <button class="open-sidebar" id="openSidebar" aria-label="Ouvrir le menu"><span></span><span></span><span></span></button>
    <section class="content">
      <div id="chat" class="chat">
        <div id="welcome" class="welcome"><h1>Que veux tu créer ?</h1></div>
        <div id="messages" class="messages"></div>
      </div>

      <div class="composer-wrap">
        <div class="composer">
          <textarea id="prompt" rows="3" placeholder="Écris ton message…"></textarea>
          <div id="generationSettings" class="generation-settings hidden"><div class="settings-head"><div><b>Paramètres de génération</b><span>Ajuste le résultat sans quitter la conversation.</span></div><button id="closeSettings" type="button">×</button></div><div class="settings-grid"><label>Qualité<select id="settingQuality"><option value="draft">Rapide</option><option value="balanced" selected>Équilibrée</option><option value="quality">Haute qualité</option></select></label><label>Format<select id="settingAspect"><option value="auto" selected>Automatique</option><option value="1:1">Carré 1:1</option><option value="16:9">Paysage 16:9</option><option value="9:16">Portrait 9:16</option><option value="4:3">4:3</option><option value="3:4">3:4</option></select></label><label>Seed<input id="settingSeed" type="number" placeholder="Aléatoire"></label><label>Nombre de résultats<select id="settingCount"><option value="1" selected>1</option><option value="2">2</option><option value="4">4</option></select></label></div><div class="settings-toggle"><label><input id="settingEnhance" type="checkbox" checked> Optimisation automatique du prompt</label><label><input id="settingKeep" type="checkbox"> Conserver le seed</label></div></div><div class="composer-row">
            <div class="left-tools">
              <button id="attachBtn" class="round" aria-label="Ajouter une image">＋</button><button id="settingsBtn" class="round settings-button" aria-label="Paramètres de génération">⚙</button>
              <input id="imageFile" type="file" accept="image/*" hidden>
            </div>
            <button id="send" class="send" aria-label="Envoyer">↑</button>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="modal-backdrop hidden" id="modelModal">
  <div class="model-modal step-modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <div><h2 id="modalTitle">Avec quel modèle générer ton image</h2><p id="modalSubtitle">Choisis le modèle photo qui sera utilisé dans cette conversation.</p></div>
      <button id="closeModal" class="modal-close">×</button>
    </div>
    <div class="step-panel" id="imageStep">
      <div class="step-search task-search"><span>⌕</span><input data-search="image" placeholder="Rechercher un modèle photo…"></div>
      <div class="model-options step-options" id="imageOptions"></div>
    </div>
    <div class="step-panel hidden" id="videoStep">
      <div class="step-search task-search"><span>⌕</span><input data-search="video" placeholder="Rechercher un modèle vidéo…"></div>
      <div class="model-options step-options" id="videoOptions"></div>
    </div>
    <div class="step-footer">
      <div class="step-progress"><span id="stepProgress">1/2</span></div>
      <button id="stepValidate" class="primary-btn">Valider</button>
    </div>
    <div id="modalError" class="modal-error"></div>
  </div>
</div>

<div id="toast"></div>
<script src="/assets/app.js"></script>
</body></html>
