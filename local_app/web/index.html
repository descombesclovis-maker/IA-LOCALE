<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LocalVisionAI</title><link rel="stylesheet" href="/assets/style.css"></head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand"><div class="brand-mark">✦</div><div><b>LocalVision</b><span>AI</span></div></div>
      <button class="close-sidebar" id="closeSidebar" aria-label="Fermer">×</button>
    </div>

    <div class="search-wrap"><span>⌕</span><input id="modelSearch" type="search" placeholder="Rechercher un modèle…"></div>

    <div class="nav-scroll">
      <div class="section-title">MODÈLES</div>
      <div id="models" class="models"></div>

      <div class="section-title library-title">MA BIBLIOTHÈQUE</div>
      <button class="library-item" id="photosLibrary"><span>▧</span><span>Mes photos générées</span><em id="photoCount">0</em></button>
      <button class="library-item" id="videosLibrary"><span>▣</span><span>Mes vidéos générées</span><em id="videoCount">0</em></button>
      <button class="library-item" id="retouchLibrary"><span>✦</span><span>Mes retouches générées</span><em id="retouchCount">0</em></button>
    </div>

    <div class="sidebar-bottom">
      <button id="importBtn" class="ghost">＋ Importer un workflow</button>
      <input id="workflowFile" type="file" accept=".json,application/json" hidden>
      <button id="comfyBtn" class="ghost">Ouvrir ComfyUI</button>
      <div class="status"><i></i><span id="statusText">Vérification…</span></div>
    </div>
  </aside>

  <main class="main">
    <button class="open-sidebar" id="openSidebar" aria-label="Ouvrir le menu"><span></span><span></span><span></span></button>
    <section class="content" id="content">
      <div id="chat" class="chat">
        <div id="welcome" class="welcome"><h1>Que veux tu créer</h1></div>
        <div id="messages" class="messages"></div>
      </div>

      <div class="composer-wrap">
        <div id="imageChip" class="image-chip" hidden><span id="imageName"></span><button id="removeImage">×</button></div>
        <div class="composer">
          <textarea id="prompt" rows="3" placeholder="Que veux tu créer ?"></textarea>
          <div class="composer-row">
            <div class="left-tools">
              <button id="attachBtn" class="round" aria-label="Ajouter une image">＋</button>
              <input id="imageFile" type="file" accept="image/*" hidden>
            </div>
            <button id="generate" class="send" aria-label="Envoyer">↑</button>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
<div id="toast"></div>
<script src="/assets/app.js"></script>
</body></html>
